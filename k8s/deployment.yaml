apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-app
  labels:
    app: roadmap-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap-app
  template:
    metadata:
      labels:
        app: roadmap-app
    spec:
      containers:
      - name: roadmap-app
        image: <YOUR_ECR_REPO>:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-app-service
spec:
  selector:
    app: roadmap-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roadmap-app-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: roadmap-app-service
            port:
              number: 80
